[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "weathersummary"
version = "0.1.0"
description = "Download, validate, and summarize Toronto weather data"
requires-python = ">=3.12"
dependencies = [
    "requests==2.32.3",
    "pandas==2.2.3",
]

[tool.setuptools.packages.find]
where = ["src"]