
[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "weathersummary"
version = "0.1.0"
description = "Download, validate, and summarize Toronto weather data"
requires-python = ">=3.12"
dependencies = [
    "requests==2.32.3",
    "pandas==2.2.3",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v"

[tool.ruff]
target-version = "py312"
line-length = 88
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "LOG", "PIE", "RUF", "SIM"]

[tool.mypy]
python_version = "3.12"
files = ["src"]
disallow_untyped_defs = true
warn_return_any = true
warn_unused_ignores = true
warn_unused_configs = true
